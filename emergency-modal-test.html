<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Modal Fix Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/modal-emergency-fix.css">
    <style>
        body { padding: 20px; }
        .test-area {
            border: 2px solid #dee2e6;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .status {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 Emergency Modal Fix Test</h1>
        <p>This page tests the nuclear modal fix approach.</p>

        <div class="status" id="status">
            Status: Loading...
        </div>

        <div class="test-area">
            <h3>Modal Test Controls</h3>
            <button class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#testModal">
                Open Modal (Bootstrap way)
            </button>
            <button class="btn btn-success me-2" onclick="window.showModal('testModal')">
                Open Modal (Emergency way)
            </button>
            <button class="btn btn-danger me-2" onclick="window.hideModal('testModal')">
                Close Modal (Emergency way)
            </button>
            <button class="btn btn-info me-2" onclick="window.debugModal('testModal')">
                Debug Modal
            </button>
        </div>

        <div class="test-area">
            <h3>Click Test Results</h3>
            <div id="clickResults" class="status">
                No clicks recorded yet...
            </div>
        </div>
    </div>

    <!-- Test Modal -->
    <div class="modal fade" id="testModal" tabindex="-1" aria-labelledby="testModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="testModalLabel">🚨 Emergency Modal Test</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p><strong>If you can click these elements, the fix is working!</strong></p>
                    
                    <div style="background: #e7f3ff; padding: 10px; margin: 10px 0; border-radius: 4px; cursor: pointer;" 
                         onclick="recordClick('Blue area clicked')">
                        🔵 Click Test Area 1
                    </div>
                    
                    <div style="background: #fff2e7; padding: 10px; margin: 10px 0; border-radius: 4px; cursor: pointer;" 
                         onclick="recordClick('Orange area clicked')">
                        🟠 Click Test Area 2
                    </div>
                    
                    <div class="mb-3">
                        <label for="testInput" class="form-label">Test Input:</label>
                        <input type="text" class="form-control" id="testInput" 
                               placeholder="Type here to test" 
                               oninput="recordClick('Input changed: ' + this.value)">
                    </div>
                    
                    <div class="mb-3">
                        <label for="testSelect" class="form-label">Test Select:</label>
                        <select class="form-select" id="testSelect" onchange="recordClick('Select changed: ' + this.value)">
                            <option value="">Choose...</option>
                            <option value="option1">Option 1</option>
                            <option value="option2">Option 2</option>
                        </select>
                    </div>
                    
                    <button class="btn btn-secondary me-2" onclick="recordClick('Secondary button clicked')">
                        Test Button 1
                    </button>
                    
                    <button class="btn btn-warning me-2" onclick="recordClick('Warning button clicked')">
                        Test Button 2
                    </button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="recordClick('Primary footer button clicked')">
                        Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/modal-emergency-fix.js"></script>
    <script>
        let clickCount = 0;
        let clickResults = document.getElementById('clickResults');
        let status = document.getElementById('status');

        function recordClick(message) {
            clickCount++;
            const timestamp = new Date().toLocaleTimeString();
            const record = `[${timestamp}] ${clickCount}: ${message}`;
            
            console.log(record);
            clickResults.innerHTML += record + '<br>';
            clickResults.scrollTop = clickResults.scrollHeight;
            
            updateStatus('✅ Interactions working! Last: ' + message);
        }

        function updateStatus(message) {
            status.innerHTML = `Status: ${message}`;
            status.style.background = '#d4edda';
            status.style.color = '#155724';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus('Emergency Modal Fix loaded');
            
            // Test if emergency fix is available
            if (window.emergencyModalFix) {
                updateStatus('✅ Emergency Modal Fix is active');
            } else {
                status.innerHTML = '❌ Emergency Modal Fix not loaded';
                status.style.background = '#f8d7da';
                status.style.color = '#721c24';
            }
            
            // Add global click listener for debugging
            document.addEventListener('click', function(e) {
                if (e.target.closest('.modal')) {
                    console.log('Click detected in modal:', e.target);
                }
            }, true);
        });

        // Test programmatic modal opening after 2 seconds
        setTimeout(() => {
            console.log('Testing automatic modal opening...');
            if (window.showModal) {
                // Auto-close after 3 seconds for demo
                window.showModal('testModal');
                setTimeout(() => {
                    window.hideModal('testModal');
                    recordClick('Auto-opened and closed modal');
                }, 3000);
            }
        }, 2000);
    </script>
</body>
</html>
