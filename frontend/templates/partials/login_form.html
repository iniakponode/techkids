<form id="login-form" class="needs-validation" novalidate>
    <input type="hidden" name="next" id="next" value="{{ request.query_params.get('next', '') }}">
    <div class="mb-3">
        <label for="username" class="form-label fw-semibold">Email address</label>
        <input type="email" class="form-control form-control-lg" id="username" name="username" placeholder="you@example.com" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Password</label>
        <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Enter your password" required>
    </div>
    <button type="submit" class="btn btn-gradient w-100">Sign in</button>
</form>
